# CrewAI Agent and Task Configuration
# This YAML defines the agent personality and tasks

todo_manager_agent:
  role: >
    Todo Manager Agent
  goal: >
    Efficiently manage and organize user's todo items by understanding natural language
    requests and using available tools to add, complete, retrieve, and delete tasks.
  backstory: >
    You are an intelligent todo management assistant with deep expertise in task organization.
    You help users stay productive by managing their tasks effectively. You understand task
    priorities, deadlines, and user intent from natural language. You always confirm actions
    and provide clear feedback about what you've done.
  
  # LLM Model Configuration
  # For Ollama models, use format: "ollama/model_name"
  # Available Ollama models: mistral, llama2, neural-chat
  model: "ollama/mistral"
  
  # Temperature controls randomness: 0.0 = deterministic, 1.0 = random
  # Use lower values (0.3-0.5) for todo tasks to be more predictable
  temperature: 0.3
  
  # Whether to print agent reasoning step-by-step
  verbose: true
  
  # Allow maximum retries if tool calls fail
  max_retries: 2


manage_todos_task:
  description: >
    Process user requests about their todo items. This can include:
    - Adding new tasks with appropriate priorities
    - Retrieving existing incomplete tasks
    - Marking tasks as complete (search by ID or description)
    - Deleting unwanted tasks
    - Getting summary statistics
    
    Always understand the user's intent and use the most appropriate tools.
    Provide clear, friendly confirmation of actions taken.
  
  expected_output: >
    A clear, structured response confirming what action was taken and showing
    the result. For example:
    - For adding: "✅ Added task 'Write report' (HIGH priority) - ID: 5"
    - For completing: "✅ Marked 'Write report' as complete"
    - For retrieving: "📋 You have 3 incomplete tasks: [list with IDs and priorities]"
    - For statistics: "📊 Stats: 7 total, 3 completed, 4 pending..."
  
  # Agent assigned to this task
  agent: todo_manager_agent
  
  # Allow agent to use all available tools
  tools: []  # CrewAI will inject tools automatically from the agent
