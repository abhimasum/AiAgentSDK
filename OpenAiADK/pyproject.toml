[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-todo-manager"
version = "1.0.0"
description = "Todo Management Agent using OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["openai", "agent", "todo", "automation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies
dependencies = [
    "openai==1.30.0",
    "agents==1.0.0",
    "ollama==0.1.25",
    "httpx==0.25.0",
    "pydantic==2.6.0",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
]

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "ipython==8.18.0",
]

# uv configuration
[tool.uv]
managed = true

# Package discovery
[tool.uv.sources]

# Entry points for CLI commands
[project.scripts]
openai-todo = "main:main"

# URLs
[project.urls]
"Homepage" = "https://github.com/yourusername/openai-agents-todo"
"Documentation" = "https://github.com/yourusername/openai-agents-todo/blob/main/README.md"
"Repository" = "https://github.com/yourusername/openai-agents-todo"
"Bug Tracker" = "https://github.com/yourusername/openai-agents-todo/issues"
