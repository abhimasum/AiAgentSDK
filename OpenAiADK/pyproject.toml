[project]
name = "openai-todo-manager"
version = "1.0.0"
description = "Todo Management with OpenAI SDK + Ollama (Free, Local)"
requires-python = ">=3.10"

# Core dependencies - Using Ollama (no API key needed!)
dependencies = [
    "openai>=3.3.0",  # OpenAI SDK for Ollama-compatible API
    "python-dotenv>=1.0.0",
]

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "ipython==8.18.0",
]

# uv configuration
[tool.uv]
managed = true

# Package discovery
[tool.uv.sources]

# Entry points for CLI commands
[project.scripts]
openai-todo = "main:main"

# URLs
[project.urls]
"Homepage" = "https://github.com/yourusername/openai-agents-todo"
"Documentation" = "https://github.com/yourusername/openai-agents-todo/blob/main/README.md"
"Repository" = "https://github.com/yourusername/openai-agents-todo"
"Bug Tracker" = "https://github.com/yourusername/openai-agents-todo/issues"
